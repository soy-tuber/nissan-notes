<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#07090f">
<style>
:root{
  color-scheme:dark;
  --bg:#07090f; --bg2:#0c1018; --panel:#0f141e; --panel2:#131a26;
  --fg:#ccd7e6; --muted:#7f8da3; --faint:#55637a;
  --rule:#1a2230; --rule2:#283546;
  --cy:#2de2ff; --mg:#ff2e6b; --am:#ffc24b; --gr:#2bf5a0; --vi:#a97bff;
  --accent:var(--cy); --accent-soft:#0d1d26;
  --red:var(--mg); --green:var(--gr); --amber:var(--am);
  --quote-bg:#0f141e; --code-bg:#121a26;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Noto Sans Mono",monospace;
  --cut:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--fg);
  background:
    radial-gradient(120% 70% at 50% -10%, #122033 0%, rgba(18,32,51,0) 60%),
    linear-gradient(var(--rule) 1px, transparent 1px) 0 0/100% 46px,
    linear-gradient(90deg, var(--rule) 1px, transparent 1px) 0 0/46px 100%,
    var(--bg);
  background-attachment:fixed;
  font-family:var(--sans);
  font-size:17px; line-height:1.95; letter-spacing:.02em;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  font-feature-settings:"palt" 1;
}
body::before{ /* グリッドを薄める */
  content:"";position:fixed;inset:0;background:var(--bg);opacity:.86;z-index:-1;pointer-events:none}
body::after{ /* スキャンライン */
  content:"";position:fixed;inset:0;z-index:60;pointer-events:none;mix-blend-mode:overlay;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px)}
.wrap{max-width:43rem;margin:0 auto;padding:0 1.35rem;position:relative}
.wide .wrap{max-width:70rem}

/* ---------- 読書プログレス ---------- */
#prog{position:fixed;top:0;left:0;height:2px;width:0;z-index:70;
  background:linear-gradient(90deg,var(--cy),var(--vi));box-shadow:0 0 10px var(--cy);
  transition:width .08s linear}

/* ---------- コンソール・ヘッダー ---------- */
header.site{border-bottom:1px solid var(--rule2);background:rgba(7,9,15,.82);
  position:sticky;top:0;z-index:40;backdrop-filter:blur(8px) saturate(1.4)}
header.site .wrap{display:flex;align-items:center;gap:1rem;max-width:70rem;
  padding-top:.7rem;padding-bottom:.7rem}
header.site .brand{font-family:var(--mono);font-size:.86rem;letter-spacing:.06em;
  color:var(--fg);text-decoration:none;white-space:nowrap}
header.site .brand .pr{color:var(--gr);margin-right:.45rem}
header.site .brand .fl{color:var(--faint)}
header.site .brand b{color:var(--cy);font-weight:600;text-shadow:0 0 12px rgba(45,226,255,.5)}
.cur{display:inline-block;width:.5em;height:1em;vertical-align:-.12em;margin-left:.3em;
  background:var(--cy);box-shadow:0 0 8px var(--cy);animation:bl 1.1s step-end infinite}
@keyframes bl{50%{opacity:0}}
header.site nav{margin-left:auto;display:flex;gap:.2rem;flex-wrap:wrap}
header.site nav a{font-family:var(--mono);color:var(--muted);text-decoration:none;
  font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;padding:.25rem .5rem;
  border:1px solid transparent;transition:.15s}
header.site nav a:hover{color:var(--cy);border-color:var(--rule2);
  text-shadow:0 0 10px rgba(45,226,255,.6)}
@media(max-width:40rem){header.site nav{display:none}}

/* ---------- 見出し ---------- */
main{padding-top:2.6rem}
main h1{font-size:2rem;line-height:1.5;margin:0 0 .8rem;font-weight:800;letter-spacing:.01em}
main h1+h2{border:none;margin:.1rem 0 1.8rem;padding:0;font-size:.95rem;color:var(--muted);
  font-weight:400;letter-spacing:.03em}
main h1+h2::before{display:none}
main h2{font-size:1.3rem;line-height:1.6;font-weight:800;letter-spacing:.01em;
  margin:3.4rem 0 1.1rem;padding:1rem 0 0 0;border-top:1px solid var(--rule2);position:relative}
main h2::before{content:"";position:absolute;top:-1px;left:0;width:3.2rem;height:2px;
  background:var(--cy);box-shadow:0 0 10px var(--cy)}
main h3{font-size:1.06rem;font-weight:700;margin:2.5rem 0 .8rem;color:var(--fg);
  font-family:var(--sans)}
main h3::before{content:"▍";color:var(--cy);margin-right:.5rem;
  text-shadow:0 0 10px rgba(45,226,255,.7)}
p{margin:0 0 1.5rem}
a{color:var(--cy);text-underline-offset:.2em;text-decoration-thickness:.5px}
a:hover{text-shadow:0 0 10px rgba(45,226,255,.5)}
strong{font-weight:700;color:#eaf2fb}
hr{border:none;border-top:1px solid var(--rule2);margin:3rem 0}

/* ---------- 引用・注記 ---------- */
blockquote{margin:2.1rem 0;padding:1.2rem 1.4rem;background:var(--panel);
  border-left:2px solid var(--cy);box-shadow:inset 3px 0 14px -8px var(--cy)}
blockquote p{font-size:.94rem;margin-bottom:.8rem}
blockquote p:last-child{margin-bottom:0}
.note{background:var(--panel);border:1px solid var(--rule2);border-left:2px solid var(--cy);
  padding:1rem 1.25rem;margin:1.7rem 0;font-size:.89rem;line-height:1.85;
  clip-path:polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)))}
.note.warn{border-left-color:var(--am)} .note.ok{border-left-color:var(--gr)}
.note p{margin:0 0 .6rem} .note p:last-child{margin-bottom:0}

/* ---------- 対話＝ターミナル ---------- */
.say{position:relative;margin:0 0 1.2rem;padding:.1rem 0 .1rem 5.6rem}
.say .who{position:absolute;left:0;top:.42rem;width:4.6rem;text-align:right;
  font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;line-height:1.6;
  color:var(--faint);text-transform:uppercase;white-space:nowrap}
.say .who::before{content:"$ ";color:var(--gr)}
.say::before{content:"";position:absolute;left:5rem;top:.55rem;bottom:.35rem;width:1px;
  background:var(--rule2)}
.say-ai{background:linear-gradient(90deg,transparent 5rem,var(--accent-soft) 5rem);
  padding-top:.7rem;padding-bottom:.7rem;padding-right:1rem}
.say-ai::before{background:var(--cy);box-shadow:0 0 10px var(--cy)}
.say-ai .who{color:var(--cy);top:.98rem;text-shadow:0 0 10px rgba(45,226,255,.5)}
.say-ai .who::before{content:"> ";color:var(--cy)}
@media(max-width:34rem){
  .say{padding-left:0;padding-top:1.7rem}
  .say .who{text-align:left;top:0;width:auto}
  .say::before{left:0;top:1.55rem;height:1px;width:1.6rem;bottom:auto}
  .say-ai{background:var(--accent-soft);padding:1.9rem .9rem .7rem .9rem}
  .say-ai .who{left:.9rem;top:.55rem} .say-ai::before{left:.9rem;top:2rem}
}

/* ---------- 図版・表 ---------- */
figure{margin:2.3rem 0}
img{max-width:100%;height:auto;display:block;margin:2.1rem auto}
table{border-collapse:collapse;width:100%;font-size:.86rem;line-height:1.7;margin:1.9rem 0}
th,td{border-bottom:1px solid var(--rule);padding:.55rem .7rem;text-align:left;vertical-align:top}
thead th{border-bottom:1px solid var(--cy);background:transparent;font-weight:700;
  font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;color:var(--cy);
  text-transform:uppercase}
tbody tr:hover{background:var(--panel)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;margin:1.9rem 0}
code{background:var(--code-bg);padding:.12em .38em;font-size:.88em;font-family:var(--mono);
  color:var(--cy);border:1px solid var(--rule)}
ul,ol{margin:0 0 1.5rem;padding-left:1.4rem}
li{margin-bottom:.45rem}
li::marker{color:var(--cy)}

/* ---------- 数値カード ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));gap:.7rem;margin:1.8rem 0}
.card{background:var(--panel);border:1px solid var(--rule2);padding:.9rem 1rem;position:relative;
  clip-path:polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
  transition:.15s}
.card:hover{border-color:var(--cy);background:var(--panel2)}
.card .lbl{display:block;font-family:var(--mono);font-size:.68rem;color:var(--faint);
  line-height:1.5;margin-bottom:.35rem;letter-spacing:.1em;text-transform:uppercase}
.card .val{display:block;font-size:1.4rem;font-weight:700;line-height:1.25;
  font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card .sub{display:block;font-size:.72rem;color:var(--faint);line-height:1.5;margin-top:.25rem}
.card.pos .val{color:var(--gr);text-shadow:0 0 14px rgba(43,245,160,.35)}
.card.neg .val{color:var(--mg);text-shadow:0 0 14px rgba(255,46,107,.35)}

/* ---------- コントロール ---------- */
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem 1.5rem;
  margin:1.8rem 0;padding:1.25rem;background:var(--panel);border:1px solid var(--rule2)}
.ctrl label{display:block;font-family:var(--mono);font-size:.74rem;color:var(--muted);
  margin-bottom:.3rem;letter-spacing:.06em}
.ctrl output{float:right;font-weight:700;color:var(--cy);font-family:var(--mono)}
.ctrl input[type=range]{width:100%;accent-color:var(--cy)}
.ctrl input[type=number]{width:100%;padding:.35rem .5rem;border:1px solid var(--rule2);
  background:var(--bg);color:var(--cy);font-size:1rem;font-family:var(--mono)}
.hi{background:rgba(43,245,160,.12);color:var(--gr)}
.lo{background:rgba(255,46,107,.12);color:var(--mg)}

/* ---------- インデックス ---------- */
.hero{padding:.6rem 0 .2rem}
.hero .eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;color:var(--cy);
  text-transform:uppercase;margin:0 0 1rem;text-shadow:0 0 12px rgba(45,226,255,.45)}
.hero h1{font-size:2.6rem;line-height:1.3;margin:0 0 1rem;font-weight:800;letter-spacing:.02em;
  animation:boot 1.1s steps(1,end) 1 both}
@keyframes boot{
  0%{opacity:0;text-shadow:none}
  12%{opacity:1;text-shadow:3px 0 var(--mg),-3px 0 var(--cy)}
  22%{opacity:.4;text-shadow:-5px 0 var(--mg),5px 0 var(--cy)}
  34%{opacity:1;text-shadow:2px 0 var(--cy),-2px 0 var(--mg)}
  48%{opacity:.75;text-shadow:-2px 0 var(--vi),2px 0 var(--cy)}
  62%{opacity:1;text-shadow:1px 0 var(--mg)}
  100%{opacity:1;text-shadow:0 0 22px rgba(45,226,255,.22)}
}
@media (prefers-reduced-motion:reduce){.hero h1{animation:none}
  .cur{animation:none} .city svg animate{display:none}}
.hero .lede{font-size:1rem;color:var(--muted);margin:0;max-width:34rem}
.hero .meta{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;color:var(--faint);margin:1.1rem 0 0}
.sec{font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;color:var(--cy);
  text-transform:uppercase;margin:2.8rem 0 1.1rem;display:flex;align-items:center;gap:.8rem}
.sec::before{content:"//";color:var(--faint)}
.sec::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--rule2),transparent)}
.strip{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;margin:2rem 0 .5rem;
  background:var(--rule2);border:1px solid var(--rule2)}
@media(min-width:40rem){.strip{grid-template-columns:repeat(3,1fr)}}
.strip div{background:var(--panel);padding:.85rem .95rem;position:relative;overflow:hidden}
.strip div::after{content:"";position:absolute;right:-18px;top:-18px;width:36px;height:36px;
  background:var(--bg);transform:rotate(45deg)}
.strip .k{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;
  color:var(--faint);margin-bottom:.35rem;text-transform:uppercase}
.strip .v{display:block;font-size:1.3rem;font-weight:700;line-height:1.25;font-family:var(--mono);
  font-variant-numeric:tabular-nums}
.strip .n{color:var(--mg);text-shadow:0 0 14px rgba(255,46,107,.35)}
.strip .p{color:var(--gr);text-shadow:0 0 14px rgba(43,245,160,.35)}
.strip .s{display:block;font-size:.68rem;color:var(--faint);margin-top:.2rem;line-height:1.5}
.tiles{display:grid;gap:.75rem;margin:0}
@media(min-width:48rem){.tiles{grid-template-columns:1fr 1fr}}
.tile{display:block;padding:1.1rem 1.2rem;border:1px solid var(--rule2);background:var(--panel);
  text-decoration:none;color:var(--fg);position:relative;transition:.16s;
  clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px))}
.tile:hover{border-color:var(--cy);background:var(--panel2);transform:translateY(-2px)}
.tile .chip{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;
  color:var(--cy);border:1px solid var(--rule2);padding:.12rem .45rem;margin-bottom:.65rem;
  text-transform:uppercase}
.tile:hover .chip{border-color:var(--cy);text-shadow:0 0 10px rgba(45,226,255,.6)}
.tile .t{display:block;font-size:1.06rem;font-weight:700;line-height:1.55;margin-bottom:.4rem}
.tile .d{display:block;font-size:.84rem;color:var(--muted);line-height:1.8}
.tile .arw{float:right;color:var(--faint);font-family:var(--mono);font-size:.85rem}
.tile:hover .arw{color:var(--cy)}
.tile.lead{grid-column:1/-1}
.tile.lead::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,var(--cy),var(--vi));box-shadow:0 0 12px var(--cy)}

/* ---------- 月次シティ ---------- */
.city{margin:1.8rem 0 .4rem;border:1px solid var(--rule2);background:#05070c;position:relative;
  overflow:hidden}
.city svg{display:block;width:100%;height:auto;margin:0}
.city .bar{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.45rem .8rem;border-bottom:1px solid var(--rule2);background:var(--panel);
  font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;color:var(--faint);
  text-transform:uppercase;flex-wrap:wrap}
.city .cap{color:var(--cy);text-shadow:0 0 10px rgba(45,226,255,.4)}
.city .lg{letter-spacing:.06em;text-transform:none;white-space:nowrap}
.city .lg b{font-weight:400}
.city .lg .c{color:var(--gr)} .city .lg .m{color:var(--mg)}

/* ---------- フッター ---------- */
footer.site{border-top:1px solid var(--rule2);margin-top:5rem;padding:2rem 0 3.5rem;
  color:var(--faint);font-size:.8rem;line-height:1.9}
footer.site .wrap{max-width:70rem}
footer.site a{color:var(--muted)}
.totop{display:inline-block;margin-top:.9rem;font-family:var(--mono);font-size:.7rem;
  letter-spacing:.12em;text-decoration:none;color:var(--faint)}
.totop:hover{color:var(--cy)}
.eof{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;color:var(--rule2);margin-top:1.2rem}
</style>
</head>
<body class="{% if page.wide %}wide{% endif %}">
<div id="prog"></div>
<header class="site"><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}"><span class="pr">$</span><b>nissan-notes</b> <span class="fl">--ticker 7201</span><span class="cur"></span></a>
  <nav>
    <a href="{{ '/psr.html' | relative_url }}">psr</a>
    <a href="{{ '/cvp.html' | relative_url }}">cvp</a>
    <a href="{{ '/monthly.html' | relative_url }}">monthly</a>
    <a href="{{ '/launches.html' | relative_url }}">launch</a>
    <a href="{{ '/nissan_dialogue.html' | relative_url }}">dialogue</a>
  </nav>
</div></header>
<main><div class="wrap">{{ content }}</div></main>
<footer class="site"><div class="wrap">
<p>本サイトの内容は情報提供を目的としたものであり、投資勧誘・投資助言ではありません。数値には開示情報からの推定・逆算が含まれます。</p>
<a class="totop" href="#">↑ TOP</a>
<p class="eof">// EOF</p>
</div></footer>
<script>
document.querySelectorAll('main table').forEach(function(t){
  if(t.parentNode.classList.contains('scroll')) return;
  var d=document.createElement('div'); d.className='scroll';
  t.parentNode.insertBefore(d,t); d.appendChild(t);
});
(function(){
  var AI=/^(opus|fable|claude|ai)$/i;
  document.querySelectorAll('main > .wrap > p').forEach(function(p){
    var s=p.firstElementChild;
    if(!s||s.tagName!=='STRONG'||s!==p.firstChild) return;
    var name=s.textContent.trim();
    if(!name||name.length>12||/[。、：:]$/.test(name)) return;
    var next=s.nextSibling;
    if(!next||next.nodeType!==3||!/^[　\s]/.test(next.nodeValue)) return;
    next.nodeValue=next.nodeValue.replace(/^[　\s]+/,'');
    var w=document.createElement('span'); w.className='who'; w.textContent=name;
    p.replaceChild(w,s);
    p.classList.add('say'); if(AI.test(name)) p.classList.add('say-ai');
  });
})();
(function(){
  var bar=document.getElementById('prog');
  function upd(){var h=document.documentElement,max=(h.scrollHeight-h.clientHeight);
    bar.style.width=(max>0?(h.scrollTop/max*100):0)+'%';}
  addEventListener('scroll',upd,{passive:true}); addEventListener('resize',upd); upd();
})();
</script>
</body>
</html>
