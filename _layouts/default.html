<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151a" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#fbfaf7; --bg2:#f4f2ec; --fg:#1a1a18; --muted:#6e6d66; --faint:#9a998f;
  --rule:#e3e1d9; --rule2:#cfcdc3;
  --accent:#1c5470; --accent-soft:#e8eff3;
  --red:#b4453c; --green:#1a7f5a; --amber:#b8860b;
  --quote-bg:#f4f2ec; --code-bg:#efede6;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Source Han Serif JP",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14151a; --bg2:#1b1d24; --fg:#e7e6e1; --muted:#9d9c94; --faint:#77766e;
         --rule:#2b2d34; --rule2:#3a3d46;
         --accent:#84b8d2; --accent-soft:#1b2830;
         --red:#e08078; --green:#5fbf98; --amber:#d9ae4e;
         --quote-bg:#1b1d24; --code-bg:#20232a; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--sans);
  font-size:17px; line-height:1.95; letter-spacing:.02em;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  font-feature-settings:"palt" 1;
}
.wrap{max-width:43rem;margin:0 auto;padding:0 1.35rem}
.wide .wrap{max-width:66rem}

/* ---------- 読書プログレス ---------- */
#prog{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:50;
  transition:width .08s linear}

/* ---------- サイトヘッダー ---------- */
header.site{border-bottom:1px solid var(--rule);background:var(--bg);
  position:sticky;top:0;z-index:40;backdrop-filter:saturate(1.6) blur(6px)}
header.site .wrap{display:flex;align-items:baseline;gap:1.25rem;
  padding-top:.85rem;padding-bottom:.85rem;max-width:66rem}
header.site .brand{font-family:var(--serif);font-size:1rem;font-weight:700;
  letter-spacing:.06em;color:var(--fg);text-decoration:none;white-space:nowrap}
header.site .brand .tick{font-family:var(--mono);font-size:.7rem;color:var(--faint);
  letter-spacing:.12em;margin-left:.5rem;font-weight:400}
header.site nav{margin-left:auto;display:flex;gap:1.1rem}
header.site nav a{color:var(--muted);text-decoration:none;font-size:.82rem;letter-spacing:.05em}
header.site nav a:hover{color:var(--accent)}
@media(max-width:34rem){header.site nav{display:none}}

/* ---------- 記事見出し ---------- */
main{padding-top:2.75rem}
main h1{font-family:var(--serif);font-size:2.05rem;line-height:1.45;margin:0 0 .75rem;
  letter-spacing:.01em;font-weight:700}
main h1+h2{border:none;margin:.2rem 0 1.6rem;padding:0;font-family:var(--sans);
  font-size:.98rem;color:var(--muted);font-weight:500;letter-spacing:.03em}
main h2{font-family:var(--serif);font-size:1.4rem;line-height:1.6;font-weight:700;
  margin:3.6rem 0 1.1rem;padding-top:1.1rem;border-top:1px solid var(--rule);
  position:relative}
main h2::before{content:"";position:absolute;top:-1px;left:0;width:2.6rem;height:2px;
  background:var(--accent)}
main h3{font-family:var(--serif);font-size:1.12rem;font-weight:700;margin:2.6rem 0 .85rem;
  color:var(--fg)}
main h3::before{content:"—— ";color:var(--accent);font-weight:400}
p{margin:0 0 1.55rem}
a{color:var(--accent);text-underline-offset:.2em;text-decoration-thickness:.5px}
strong{font-weight:700}
hr{border:none;border-top:1px solid var(--rule);margin:3.2rem 0}

/* ---------- 引用・注記 ---------- */
blockquote{margin:2.2rem 0;padding:1.3rem 1.5rem;background:var(--quote-bg);
  border-left:3px solid var(--accent);border-radius:3px}
blockquote p{font-size:.95rem;margin-bottom:.8rem}
blockquote p:last-child{margin-bottom:0}
.note{background:var(--quote-bg);border:1px solid var(--rule);border-left:3px solid var(--accent);
  border-radius:4px;padding:1.05rem 1.3rem;margin:1.8rem 0;font-size:.9rem;line-height:1.85}
.note.warn{border-left-color:var(--amber)} .note.ok{border-left-color:var(--green)}
.note p{margin:0 0 .6rem} .note p:last-child{margin-bottom:0}

/* ---------- 対話（Soy / Opus / fable） ---------- */
.say{position:relative;margin:0 0 1.35rem;padding:.1rem 0 .1rem 5.4rem}
.say .who{position:absolute;left:0;top:.38rem;width:4.4rem;text-align:right;
  font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;line-height:1.6;
  color:var(--faint);text-transform:uppercase;white-space:nowrap}
.say::before{content:"";position:absolute;left:4.85rem;top:.5rem;bottom:.35rem;width:2px;
  background:var(--rule2);border-radius:2px}
.say-ai{background:linear-gradient(90deg,transparent 4.85rem,var(--accent-soft) 4.85rem);
  border-radius:0 4px 4px 0;padding-top:.7rem;padding-bottom:.7rem;padding-right:1rem}
.say-ai::before{background:var(--accent)}
.say-ai .who{color:var(--accent);top:.95rem}
@media(max-width:34rem){
  .say{padding-left:0;padding-top:1.7rem}
  .say .who{text-align:left;top:0;width:auto}
  .say::before{left:0;top:1.55rem;height:2px;width:1.6rem;bottom:auto}
  .say-ai{background:var(--accent-soft);padding:1.9rem .9rem .7rem .9rem;border-radius:4px}
  .say-ai .who{left:.9rem;top:.55rem} .say-ai::before{left:.9rem;top:2rem}
}

/* ---------- 図版・表 ---------- */
figure{margin:2.4rem 0}
img{max-width:100%;height:auto;display:block;margin:2.2rem auto;border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:.88rem;line-height:1.7;margin:2rem 0}
th,td{border-bottom:1px solid var(--rule);padding:.55rem .7rem;text-align:left;vertical-align:top}
thead th{border-bottom:2px solid var(--rule2);background:transparent;font-weight:700;
  font-size:.8rem;letter-spacing:.04em;color:var(--muted)}
tbody tr:hover{background:var(--quote-bg)}
td.num,th.num{text-align:right;font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;margin:2rem 0}
code{background:var(--code-bg);padding:.12em .38em;border-radius:3px;font-size:.88em;
  font-family:var(--mono)}
ul,ol{margin:0 0 1.55rem;padding-left:1.4rem}
li{margin-bottom:.45rem}
li::marker{color:var(--faint)}

/* ---------- 数値カード ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));gap:.7rem;margin:1.8rem 0}
.card{background:var(--bg2);border:1px solid var(--rule);border-radius:6px;padding:.9rem 1rem;
  transition:border-color .15s}
.card:hover{border-color:var(--rule2)}
.card .lbl{display:block;font-size:.74rem;color:var(--muted);line-height:1.5;margin-bottom:.3rem;
  letter-spacing:.04em}
.card .val{display:block;font-size:1.4rem;font-weight:700;line-height:1.25;
  font-feature-settings:"tnum";font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card .sub{display:block;font-size:.73rem;color:var(--faint);line-height:1.5;margin-top:.25rem}
.card.pos .val{color:var(--green)} .card.neg .val{color:var(--red)}

/* ---------- コントロール ---------- */
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem 1.5rem;
  margin:1.8rem 0;padding:1.25rem;background:var(--bg2);border:1px solid var(--rule);border-radius:6px}
.ctrl label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.3rem}
.ctrl output{float:right;font-weight:700;color:var(--fg);font-feature-settings:"tnum"}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl input[type=number]{width:100%;padding:.35rem .5rem;border:1px solid var(--rule);
  border-radius:4px;background:var(--bg);color:var(--fg);font-size:1rem}
.hi{background:rgba(26,127,90,.13)} .lo{background:rgba(180,69,60,.13)}

/* ---------- インデックス ---------- */
.hero .meta{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;color:var(--faint);
  margin:1.1rem 0 0}
.strip{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;
  margin:2.2rem 0 .5rem;background:var(--rule);border:1px solid var(--rule);border-radius:7px;
  overflow:hidden}
@media(min-width:40rem){.strip{grid-template-columns:repeat(3,1fr)}}
.strip div{background:var(--bg);padding:.85rem .95rem}
.strip .k{display:block;font-size:.7rem;letter-spacing:.06em;color:var(--faint);margin-bottom:.3rem}
.strip .v{display:block;font-size:1.28rem;font-weight:700;line-height:1.25;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.strip .n{color:var(--red)} .strip .p{color:var(--green)}
.strip .s{display:block;font-size:.7rem;color:var(--faint);margin-top:.2rem;line-height:1.5}
.tiles{display:grid;gap:.75rem;margin:0}
@media(min-width:48rem){.tiles{grid-template-columns:1fr 1fr}}
.tile{display:block;padding:1.15rem 1.25rem;border:1px solid var(--rule);border-radius:8px;
  background:var(--bg2);text-decoration:none;color:var(--fg);
  transition:border-color .15s,transform .15s,box-shadow .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px);
  box-shadow:0 6px 18px -12px rgba(0,0,0,.35)}
.tile .chip{display:inline-block;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;
  color:var(--accent);border:1px solid var(--rule2);border-radius:3px;padding:.1rem .4rem;
  margin-bottom:.6rem;text-transform:uppercase}
.tile .t{display:block;font-family:var(--serif);font-size:1.1rem;font-weight:700;line-height:1.55;
  margin-bottom:.4rem}
.tile .d{display:block;font-size:.85rem;color:var(--muted);line-height:1.8}
.tile .arw{float:right;color:var(--faint);font-size:.9rem}
.tile:hover .arw{color:var(--accent)}
.tile.lead{grid-column:1/-1;background:linear-gradient(135deg,var(--accent-soft),var(--bg2) 60%)}

.hero{padding:1rem 0 .5rem}
.hero .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;color:var(--faint);
  text-transform:uppercase;margin:0 0 .9rem}
.hero h1{font-size:2.5rem;line-height:1.35;margin:0 0 1rem}
.hero .lede{font-size:1.02rem;color:var(--muted);margin:0;max-width:34rem}
.rule{height:1px;background:var(--rule);margin:2.6rem 0 0}
.sec{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;color:var(--faint);
  text-transform:uppercase;margin:2.8rem 0 1.2rem;display:flex;align-items:center;gap:.8rem}
.sec::after{content:"";flex:1;height:1px;background:var(--rule)}
.index-list{list-style:none;padding:0;margin:0;display:grid;gap:.6rem}
.index-list li{margin:0}
.index-list li > a{display:block;padding:1.05rem 1.15rem;border:1px solid var(--rule);
  border-radius:7px;background:var(--bg2);text-decoration:none;color:var(--fg);
  font-family:var(--serif);font-size:1.08rem;font-weight:700;line-height:1.6;
  transition:border-color .15s,transform .15s}
.index-list li > a:hover{border-color:var(--accent);transform:translateY(-1px)}
.index-list li > a::after{content:"→";float:right;color:var(--faint);font-weight:400;
  font-family:var(--sans)}
.index-list li > a:hover::after{color:var(--accent)}
.index-list .desc{display:block;color:var(--muted);font-size:.87rem;margin:.45rem 0 0;
  line-height:1.8;font-family:var(--sans);font-weight:400;padding:0 1.15rem 0}
.index-list li > a + .desc{margin-top:-.15rem;padding-top:.5rem}

/* ---------- フッター ---------- */
footer.site{border-top:1px solid var(--rule);margin-top:5.5rem;padding:2.2rem 0 3.5rem;
  color:var(--faint);font-size:.82rem;line-height:1.9}
footer.site .wrap{max-width:66rem}
footer.site a{color:var(--muted)}
.totop{display:inline-block;margin-top:.9rem;font-family:var(--mono);font-size:.72rem;
  letter-spacing:.1em;text-decoration:none;color:var(--faint)}
.totop:hover{color:var(--accent)}
</style>
</head>
<body class="{% if page.wide %}wide{% endif %}">
<div id="prog"></div>
<header class="site"><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}">日産分析ノート<span class="tick">7201</span></a>
  <nav>
    <a href="{{ '/psr.html' | relative_url }}">PSR</a>
    <a href="{{ '/cvp.html' | relative_url }}">CVP</a>
    <a href="{{ '/monthly.html' | relative_url }}">月次</a>
    <a href="{{ '/launches.html' | relative_url }}">投入</a>
    <a href="{{ '/nissan_dialogue.html' | relative_url }}">対話</a>
  </nav>
</div></header>
<main><div class="wrap">{{ content }}</div></main>
<footer class="site"><div class="wrap">
<p>本サイトの内容は情報提供を目的としたものであり、投資勧誘・投資助言ではありません。数値には開示情報からの推定・逆算が含まれます。</p>
<a class="totop" href="#">↑ TOP</a>
</div></footer>
<script>
// 横スクロール可能な表にラッパーを付ける
document.querySelectorAll('main table').forEach(function(t){
  if(t.parentNode.classList.contains('scroll')) return;
  var d=document.createElement('div'); d.className='scroll';
  t.parentNode.insertBefore(d,t); d.appendChild(t);
});
// 対話形式の段落を話者ラベル付きに変換
(function(){
  var AI=/^(opus|fable|claude|ai)$/i;
  document.querySelectorAll('main > .wrap > p').forEach(function(p){
    var s=p.firstElementChild;
    if(!s||s.tagName!=='STRONG'||s!==p.firstChild) return;
    var name=s.textContent.trim();
    if(!name||name.length>12||/[。、：:]$/.test(name)) return;
    var next=s.nextSibling;
    if(!next||next.nodeType!==3||!/^[　\s]/.test(next.nodeValue)) return;
    next.nodeValue=next.nodeValue.replace(/^[　\s]+/,'');
    var w=document.createElement('span'); w.className='who'; w.textContent=name;
    p.replaceChild(w,s);
    p.classList.add('say'); if(AI.test(name)) p.classList.add('say-ai');
  });
})();
// 読書プログレス
(function(){
  var bar=document.getElementById('prog');
  function upd(){
    var h=document.documentElement,
        max=(h.scrollHeight-h.clientHeight);
    bar.style.width=(max>0?(h.scrollTop/max*100):0)+'%';
  }
  addEventListener('scroll',upd,{passive:true}); addEventListener('resize',upd); upd();
})();
</script>
</body>
</html>
